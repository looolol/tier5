<div class="slot-row-wrapper" [class.is-vault]="isVault">
    @if (!isVault) {
        <div class="equipped-box" cdkDropList [cdkDropListData]="[equippedItem()]">
            @if (equippedItem()) {
                <app-inventory-item [item]="equippedItem()!" [isEquippedFrame]="true" />
            } @else {
                <div class="empty-placeholder-slot" cdkDragDisabled></div>
            }
        </div>
    }

    <div class="inventory-grid">
        @for (item of inventoryPool(); track item.instanceId || item.hash) {
            <app-inventory-item [item]="item" />
        }
    </div>
</div>
