<div class="item-node" 
        cdkDrag 
        [cdkDragData]="item"
        cdkDragBoundary=".matrix-grid"
        [class.equipped-scale]="isEquippedFrame"
        [title]="item.name">
        
    <div class="drag-handle" cdkDragHandle></div>
    <img [src]="item.icon" [alt]="item.name" class="item-icon" />
    <div class="tier-indicator" [attr.data-tier]="item.tier | lowercase" ></div>
</div>
