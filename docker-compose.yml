version: '3.8'

services:
  backend:
    build:
      context: .
      target: backend-dev
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/frontend/.angular
    env_file:
      - .env
  
  frontend:
    build:
      context: .
      target: frontend-dev
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/frontend/.angular
    env_file:
      - .env
    depends_on:
      - backend